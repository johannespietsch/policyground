[project]
name = "policyground"
version = "0.1.0"
description = "KG-grounded policy Q&A with drift detection"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyground"]
