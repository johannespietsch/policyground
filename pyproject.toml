[project]
name = "policyground"
version = "0.1.0"
description = "KG-grounded policy Q&A with drift detection"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "confluent-kafka==2.16.0",
    "fastapi>=0.143.3",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyground"]
