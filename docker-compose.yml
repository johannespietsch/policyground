services:
  postgres:
    build: ./db
    image: policyground-postgres
    # Comes back after a Docker Desktop restart or update (it stopped twice: INCIDENTS #6).
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-pgadmin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-pgadmin}
      POSTGRES_DB: policyground
      INGEST_RW_PASSWORD: ${INGEST_RW_PASSWORD:-ingest_rw}
      API_RO_PASSWORD: ${API_RO_PASSWORD:-api_ro}
      AIRFLOW_META_PASSWORD: ${AIRFLOW_META_PASSWORD:-airflow_meta}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d policyground"]
      interval: 2s
      timeout: 3s
      retries: 15

  redpanda:
    # Kafka-compatible broker (D32). Single node, dev mode: fine for one machine, not prod.
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
